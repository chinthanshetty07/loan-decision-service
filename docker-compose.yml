services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: los
      POSTGRES_USER: los
      POSTGRES_PASSWORD: los
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U los -d los"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/los
      DB_USER: los
      DB_PASSWORD: los
      JWT_SECRET: ${JWT_SECRET:-local-demo-secret-change-me-0123456789abcdef}
    ports:
      - "8080:8080"

volumes:
  pgdata:
